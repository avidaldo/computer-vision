[project]
name = "computer-vision"
version = "0.1.0"
description = "Tools and notebooks for computer vision learning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb",
    "ipykernel",
    "matplotlib",
    "numpy",
    "opencv-python",
    "pillow",
    "pydantic-settings>=2.13.1",
    "pyyaml",
    "scikit-learn",
    "sentence-transformers",
    "torch",
    "ultralytics",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["4-face-auth-app"]
testpaths = ["4-face-auth-app/tests"]
filterwarnings = ["error"]
